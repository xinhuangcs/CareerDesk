name: Real model evaluation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-model-eval
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      APP_RUNTIME_MODE: test
      APP_LLM_MODEL: ${{ vars.LLM_EVAL_MODEL }}
      APP_LLM_CONTEXT_WINDOW: ${{ vars.LLM_EVAL_CONTEXT_WINDOW }}
      APP_LLM_MAX_OUTPUT_TOKENS: ${{ vars.LLM_EVAL_MAX_OUTPUT_TOKENS }}
      CAREERDESK_LLM_EVAL_API_KEY: ${{ secrets.CAREERDESK_LLM_EVAL_API_KEY }}
      CAREERDESK_LLM_EVAL_BASE_URL: ${{ secrets.CAREERDESK_LLM_EVAL_BASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.21"
          python-version: "3.12.12"
      - run: uv sync --project backend --locked
      - name: Run opt-in real-model evaluation
        run: >-
          uv run --project backend python -B "ai-evals/run.py"
          --model "${APP_LLM_MODEL}"
          --context-window "${APP_LLM_CONTEXT_WINDOW}"
          --max-output-tokens "${APP_LLM_MAX_OUTPUT_TOKENS}"
          --acknowledge-costs
      - name: Upload the evaluation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: careerdesk-ai-metrics-${{ github.run_id }}
          path: ai-evals/data/
          if-no-files-found: warn
          retention-days: 14
