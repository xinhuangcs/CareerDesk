[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "careerdesk"
version = "1.0.1"
description = "CareerDesk：辅助秋招的求职助手 agent（简历 / 匹配 / 追问 / 研究），基于 agentmaker。"
requires-python = ">=3.12,<3.14"
authors = [{ name = "xinhuang" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "agentmaker[anthropic,gemini,rag,search]==0.2.0",
    "markitdown[pdf,docx]>=0.1.6", # PDF/DOCX readers are optional MarkItDown extras.
    "fastapi>=0.136",              # Native SSE support is required.
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.18",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pathspec>=0.12,<1",
    "pyyaml>=6.0,<7",
    "keyring>=25.7,<26",
    "tzdata>=2025.2; sys_platform == 'win32'",
    "pywebview>=5.0",
    "openpyxl>=3.1,<4",
    "xlrd>=2.0,<3",
]

[project.scripts]
careerdesk = "careerdesk.bootstrap.desktop:main"
careerdesk-data = "careerdesk.bootstrap.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.0.0,<3",
    "pytest>=8.0",
]
desktop-build = [
    "pyinstaller==6.21.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/careerdesk"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
